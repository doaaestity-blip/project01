<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - Forms & Inputs</title>
</head>
<body>

    <h1>User Registration Form</h1>

    <form action="#" method="POST">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required minlength="3">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="6">

        <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </fieldset>

        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">--Please choose an option--</option>
            <option value="jo">Jordan</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
        </select>

        <label for="bio">Biography / Comments:</label>
        <textarea id="bio" name="bio" rows="4" cols="30" minlength="10"></textarea>

        <input type="checkbox" id="agreement" name="agreement" required>
        <label for="agreement">I agree to the terms and conditions</label>

        <button type="submit">Register</button>
    </form>

</body>
</html>
